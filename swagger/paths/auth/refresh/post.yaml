tags:
  - Auth
summary: Refresh user session
operationId: refreshUser
description: Refreshes the user's session by using the refresh token stored in cookies.
security: []
parameters:
  - in: cookie
    name: sessionId
    schema:
      type: string
      example: 'abc123xyzasdsadsad'
    required: true
    description: The session ID stored in cookies.
  - in: cookie
    name: refreshToken
    schema:
      type: string
      example: 'abc123xyzsadsadjlkdjasdjladj'
    required: true
    description: The refresh token used to generate a new access token.
responses:
  '200':
    description: Successfully refreshed session. A new access token has been generated.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  description: JWT access token
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
